<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="../assets/css/style.css">

    .post-wrap {

      color: var(--color-text-light);
      margin-bottom: 40px;
      transition: color 0.2s;
    }

    .post-back:hover {

    }

    .post-date {
      font-size: 13px;
      font-weight: 600;
      color: #b08800;

      color: var(--color-text-main);
      line-height: 1.4;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--color-border);
    }

    .post-body {
      font-size: 16px;
      color: var(--color-text-sub);
      line-height: 2;
    }

    .post-body p {
      margin-bottom: 20px;
    }

    .post-body strong {
