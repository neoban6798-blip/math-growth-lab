<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="생각의힘 수학학원 학원소식. 최신 공지사항과 학원 소식을 확인하세요.">
  <title>학원소식 | 생각의힘 수학학원</title>
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>

    /* ── 히어로 ── */
    .page-hero {
      padding: 0;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      background: #fffde7;
      text-align: center;
      color: var(--color-text-main);
    }

    .page-hero::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 62%;
      height: 100%;
      /* 👇 학원소식 페이지에 쓸 이미지 파일 이름으로 수정해 주세요 👇 */
      background: url('../assets/image/content/time.jpg') center/cover no-repeat;
    }

    .page-hero::after {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 62%;
      height: 100%;
      background: linear-gradient(to right, transparent, #fffde7);
    }

    .page-hero-inner {
      position: relative;
      z-index: 2;
      width: 44%;
      padding-right: 60px;
      text-align: left;
    }

    .page-hero-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-light);
      margin-bottom: 16px;
    }

    .page-hero-title {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 16px;
      color: var(--color-text-main);
    }

    .page-hero-sub {
      font-size: 16px;
      color: var(--color-text-sub);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.8;
    }

    /* ── 소식 목록 ── */
    #news-list {
      padding: var(--section-padding);
      background: var(--color-bg-white);
    }

    .news-container {
      max-width: 760px;
      margin: 0 auto;
    }

    .news-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
      border-bottom: 1px solid var(--color-border);
      gap: 24px;
      transition: background 0.2s;
    }

    .news-item:first-child {
      border-top: 1px solid var(--color-border);
    }

    .news-item-left {
      flex: 1;
    }

    .news-item-date {
      font-size: 12px;
      color: #b08800;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
    }

    .news-item-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-text-main);
      margin-bottom: 6px;
    }

    .news-item-summary {
      font-size: 14px;
      color: var(--color-text-sub);
      line-height: 1.7;
    }

    .news-item-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #c47f00;
      white-space: nowrap;
      padding: 10px 20px;
      border: 1px solid #fde047;
      border-radius: 8px;
      background: #fffde7;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
    }

    .news-item-btn:hover {
      background: #fde047;
      color: #713f12;
    }

    /* 로딩 / 빈 상태 */
    .news-empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--color-text-light);
      font-size: 15px;
    }

    .news-loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--color-text-light);
      font-size: 15px;
    }

  </style>
</head>

<body>
  <div id="site-header"></div>

  <main>

    <!-- 히어로 -->
    <section class="page-hero">
      <div class="page-hero-inner">
        <p class="page-hero-label">News</p>
        <h1 class="page-hero-title">학원소식</h1>
        <p class="page-hero-sub">수업 일정, 공지사항, 학원 소식을 안내드립니다.</p>
      </div>
    </section>

    <!-- 소식 목록 -->
    <section id="news-list">
      <div class="news-container" id="news-container">
        <p class="news-loading">소식을 불러오는 중입니다...</p>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
  <script src="../assets/js/components.js"></script>

  <script>
    // posts.json을 읽어서 목록 자동 생성
    fetch('../news/posts.json')
      .then(res => res.json())
      .then(posts => {
        const container = document.getElementById('news-container');

        if (!posts || posts.length === 0) {
          container.innerHTML = '<p class="news-empty">등록된 소식이 없습니다.</p>';
          return;
        }

        // 날짜 내림차순 정렬
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));

        container.innerHTML = posts.map(post => `
          <div class="news-item">
            <div class="news-item-left">
              <p class="news-item-date">${formatDate(post.date)}</p>
              <p class="news-item-title">${post.title}</p>
              <p class="news-item-summary">${post.summary}</p>
            </div>
            <a href="${post.date}.html" class="news-item-btn">
              자세히 보기 <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('news-container').innerHTML =
          '<p class="news-empty">소식을 불러오지 못했습니다.</p>';
      });

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
    }
  </script>

</body>
</html>
