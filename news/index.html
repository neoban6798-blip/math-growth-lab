<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://thinkmath.kr/news/">
  <meta name="description" content="생각의힘 수학학원 학원소식. 최신 공지사항과 학원 소식을 확인하세요.">
  <title>학원소식 | 생각의힘 수학학원</title>
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>

    /* ── 히어로 ── */
    .page-hero {
      padding: 0;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      background: #fffde7;
      text-align: center;
      color: var(--color-text-main);
    }

    .page-hero::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 62%;
      height: 100%;
      background: url('../assets/image/content/time.jpg') center/cover no-repeat;
    }

    .page-hero::after {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 62%;
      height: 100%;
      background: linear-gradient(to right, transparent, #fffde7);
    }

    .page-hero-inner {
      position: relative;
      z-index: 2;
      width: 44%;
      padding-right: 60px;
      text-align: left;
    }

    .page-hero-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-light);
      margin-bottom: 16px;
    }

    .page-hero-title {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 16px;
      color: var(--color-text-main);
    }

    .page-hero-sub {
      font-size: 16px;
      color: var(--color-text-sub);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.8;
    }

    /* ── 소식 목록 (공통) ── */
    .news-container {
      max-width: 760px;
      margin: 0 auto;
    }

    .news-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
      border-bottom: 1px solid var(--color-border);
      gap: 24px;
      transition: background 0.2s;
    }

    .news-item:first-child {
      border-top: 1px solid var(--color-border);
    }

    .news-item-left {
      flex: 1;
    }

    .news-item-date {
      font-size: 12px;
      color: #b08800;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
    }

    .news-item-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-text-main);
      margin-bottom: 6px;
    }

    .news-item-summary {
      font-size: 14px;
      color: var(--color-text-sub);
      line-height: 1.7;
    }

    .news-item-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #c47f00;
      white-space: nowrap;
      padding: 10px 20px;
      border: 1px solid #fde047;
      border-radius: 8px;
      background: #fffde7;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
    }

    .news-item-btn:hover {
      background: #fde047;
      color: #713f12;
    }

    /* 로딩 / 빈 상태 */
    .news-empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--color-text-light);
      font-size: 15px;
    }

    .news-loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--color-text-light);
      font-size: 15px;
    }

    /* ── 이중 게시판 레이아웃 ── */
    .dual-board {
      display: flex;
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--section-padding);
    }

    .news-column {
      flex: 1;
      min-width: 0;
    }

    .news-column-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #fde047;
      color: var(--color-text-main);
    }

    @media (max-width: 768px) {
      .dual-board {
        flex-direction: column;
        gap: 48px;
      }
    }

  </style>
</head>

<body>
  <div id="site-header"></div>

  <main>

    <!-- 히어로 -->
    <section class="page-hero">
      <div class="page-hero-inner">
        <p class="page-hero-label">News</p>
        <h1 class="page-hero-title">학원소식</h1>
        <p class="page-hero-sub">수업 일정, 공지사항, 학원 소식을 안내드립니다.</p>
      </div>
    </section>

    <!-- 이중 게시판 -->
    <section class="dual-board">
      <!-- 왼쪽: 학원소식 -->
      <div class="news-column">
        <h2 class="news-column-title">학원소식</h2>
        <div class="news-container" id="academy-news-container">
          <p class="news-loading">소식을 불러오는 중입니다...</p>
        </div>
      </div>

      <!-- 오른쪽: 신봉지역 학교소식 -->
      <div class="news-column">
        <h2 class="news-column-title">신봉지역 학교소식</h2>
        <div class="news-container" id="school-news-container">
          <p class="news-loading">소식을 불러오는 중입니다...</p>
        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
  <script src="../assets/js/components.js"></script>

  <script>
    // 공통 렌더 함수
    function renderNews(containerId, posts, linkPrefix) {
      const container = document.getElementById(containerId);

      if (!posts || posts.length === 0) {
        container.innerHTML = '<p class="news-empty">등록된 소식이 없습니다.</p>';
        return;
      }

      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      container.innerHTML = posts.map(post => `
        <div class="news-item">
          <div class="news-item-left">
            <p class="news-item-date">${formatDate(post.date)}</p>
            <p class="news-item-title">${post.title}</p>
            <p class="news-item-summary">${post.summary}</p>
          </div>
          <a href="${linkPrefix}/${post.date}.html" class="news-item-btn">
            자세히 보기 <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      `).join('');
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
    }

    // 학원소식 불러오기
    fetch('../news/news.json')
      .then(res => res.json())
      .then(posts => renderNews('academy-news-container', posts, '../news'))
      .catch(() => {
        document.getElementById('academy-news-container').innerHTML =
          '<p class="news-empty">소식을 불러오지 못했습니다.</p>';
      });

    // 신봉지역 학교소식 불러오기
    fetch('../school_news/school_news.json')
      .then(res => res.json())
      .then(posts => renderNews('school-news-container', posts, '../school_news'))
      .catch(() => {
        document.getElementById('school-news-container').innerHTML =
          '<p class="news-empty">소식을 불러오지 못했습니다.</p>';
      });
  </script>

</body>
</html>
